services:
  web:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      PORT: 8000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: INFO
      CACHE_EXPIRATION: 600
      APP_VERSION: dev
      STEAM_REQUEST_DELAY_MS: 0
      STEAM_REQUEST_TIMEOUT_MS: 15000
    restart: always
  redis:
    image: "redis:8.4.0"
    restart: always
