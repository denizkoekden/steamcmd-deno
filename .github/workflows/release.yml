name: Build and Release

on:
  push:
    branches:
      - release

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Create Release and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.5.6

      - name: Get Latest Tag
        id: get_latest_tag
        run: |
          git fetch --tags
          TAG=$(git tag -l 'v*' --sort=-version:refname | head -n1)
          TAG=${TAG:-v0.0.0}
          echo "LATEST_TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Bump Version
        id: bump_version
        run: |
          latest_version=${{ steps.get_latest_tag.outputs.LATEST_TAG }}
          if [[ "$latest_version" == "v0.0.0" ]]; then
            new_version="v1.0.0"
          else
            new_version=$(echo "$latest_version" | awk -F. '{$NF = $NF + 1;} 1' | sed 's/ /./g')
          fi
          echo "NEW_VERSION=$new_version" >> $GITHUB_OUTPUT

      - name: Deno Lint & Format Check
        run: deno task check

      - name: Prepare output directory
        run: mkdir -p bin

      - name: Build binaries
        run: deno task build_all

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        env:
          APP_VERSION: ${{ steps.bump_version.outputs.NEW_VERSION }}
          IMAGE_NAME: ${{ github.repository }}
        run: |
          image="ghcr.io/${IMAGE_NAME}"
          image="${image,,}"
          docker build --build-arg APP_VERSION=${APP_VERSION} -t "$image:${APP_VERSION}" -t "$image:latest" .
          docker push "$image:${APP_VERSION}"
          docker push "$image:latest"

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.bump_version.outputs.NEW_VERSION }} \
            --title "Release ${{ steps.bump_version.outputs.NEW_VERSION }}" \
            --notes "Automated release."

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ steps.bump_version.outputs.NEW_VERSION }} bin/steamcmd_mac_amd64 --clobber
          gh release upload ${{ steps.bump_version.outputs.NEW_VERSION }} bin/steamcmd_mac_arm --clobber
          gh release upload ${{ steps.bump_version.outputs.NEW_VERSION }} bin/steamcmd_win64.exe --clobber
          gh release upload ${{ steps.bump_version.outputs.NEW_VERSION }} bin/steamcmd_linux_amd64 --clobber
          gh release upload ${{ steps.bump_version.outputs.NEW_VERSION }} bin/steamcmd_linux_arm --clobber
